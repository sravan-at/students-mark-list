<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Mark List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>STUDENT MARK LIST</h1>

        <div class="form-box">

            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="form-group">
                    <label>Student Name</label>
                    <input type="text" id="studentName" required>
                </div>

                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="number" id="rollNumber" required>
                </div>

                <div class="form-group">
                    <label>Maths</label>
                    <input type="number" id="maths" min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>English</label>
                    <input type="number" id="english" min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Social Science</label>
                    <input type="number" id="social" min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Science</label>
                    <input type="number" id="science" min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Malayalam</label>
                    <input type="number" id="malayalam" min="0" max="100" required>
                </div>

                <button type="button">Add Student</button>

            </form>

        </div>

        <div class="table-box">

            <table>

                <thead>
                    <tr>
                        <th>Sl. No</th>
                        <th>Student Name</th>
                        <th>Roll No</th>
                        <th>Maths</th>
                        <th>English</th>
                        <th>Social Science</th>
                        <th>Science</th>
                        <th>Malayalam</th>
                        <th>Total</th>
                        <th>Percentage</th>
                        <th>Grade</th>
                    </tr>
                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </div>

    <script src="script2.js"></script>

</body>
</html>
